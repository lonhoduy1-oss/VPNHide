name: Build VPNHide RootHide DEB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout VPNHide
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid dpkg xz

      - name: Install roothide/theos & SDKs
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/*.sdk "$THEOS/sdks/"

      - name: Install libSandy into Theos
        run: |
          git clone --depth=1 https://github.com/roothide/libSandy.git /tmp/libSandy
          cd /tmp/libSandy
          if [ -f ./install_to_theos.sh ]; then
            chmod +x ./install_to_theos.sh
            THEOS_PACKAGE_SCHEME=roothide ./install_to_theos.sh
          fi

      - name: Install AltList into Theos (if missing)
        run: |
          if [ ! -d "$THEOS/lib/iphone/roothide/AltList.framework" ] && [ ! -d "$THEOS/lib/AltList.framework" ]; then
            git clone --depth=1 https://github.com/opa334/AltList.git /tmp/AltList
            cd /tmp/AltList
            chmod +x ./install_to_theos.sh
            THEOS_PACKAGE_SCHEME=roothide ./install_to_theos.sh
          fi

      - name: Build release .deb
        run: make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNHide-roothide-deb
          path: packages/*.deb
