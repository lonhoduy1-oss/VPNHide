name: Build VPNHide RootHide DEB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout VPNHide
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid dpkg xz

      - name: Install roothide/theos & patched iPhoneOS16.5.sdk
        run: |
          set -e
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          ls -la "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework"

      - name: Install prebuilt libSandy & AltList for RootHide
        run: |
          set -e
          mkdir -p "$THEOS/lib/iphone/roothide" "$THEOS/include"
          curl -fsSL https://raw.githubusercontent.com/roothide/roothide.github.io/main/Packages -o /tmp/Packages

          # 1. Lấy libsandy.dylib build sẵn + header libSandy.h
          SANDY_DEB=$(awk '/^Package: com\.opa334\.libsandy$/{f=1} f && /^Filename:/{p=$2; f=0} END{print p}' /tmp/Packages)
          curl -fsSL "https://raw.githubusercontent.com/roothide/roothide.github.io/main/${SANDY_DEB#./}" -o /tmp/libsandy.deb
          dpkg-deb -x /tmp/libsandy.deb /tmp/libsandy_ext
          SANDY_DYLIB=$(find /tmp/libsandy_ext -name 'libsandy.dylib' | head -n 1)
          cp -v "$SANDY_DYLIB" "$THEOS/lib/iphone/roothide/libsandy.dylib"
          cp -v "$SANDY_DYLIB" "$THEOS/lib/libsandy.dylib"

          git clone --depth=1 https://github.com/roothide/libSandy.git /tmp/libSandy
          cp -v /tmp/libSandy/libSandy.h "$THEOS/include/libSandy.h"

          # 2. Lấy AltList.framework build sẵn + headers
          ALTLIST_DEB=$(awk '/^Package: com\.opa334\.altlist$/{f=1} f && /^Filename:/{p=$2; f=0} END{print p}' /tmp/Packages)
          if [ -n "$ALTLIST_DEB" ]; then
            curl -fsSL "https://raw.githubusercontent.com/roothide/roothide.github.io/main/${ALTLIST_DEB#./}" -o /tmp/altlist.deb
            dpkg-deb -x /tmp/altlist.deb /tmp/altlist_ext
            ALTLIST_FW=$(find /tmp/altlist_ext -name 'AltList.framework' -type d | head -n 1)
            git clone --depth=1 https://github.com/opa334/AltList.git /tmp/AltList
            mkdir -p "$ALTLIST_FW/Headers"
            cp -v /tmp/AltList/*.h "$ALTLIST_FW/Headers/"
            rm -rf "$THEOS/lib/iphone/roothide/AltList.framework" "$THEOS/lib/AltList.framework"
            cp -R "$ALTLIST_FW" "$THEOS/lib/iphone/roothide/AltList.framework"
            cp -R "$ALTLIST_FW" "$THEOS/lib/AltList.framework"
          fi

      - name: Build release .deb
        run: |
          set -e
          make package FINALPACKAGE=1 TARGET=iphone:16.5:15.0
          ls -lh packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNHide-roothide-deb
          path: packages/*.deb
